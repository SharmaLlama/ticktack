# ===== mkdocs.yml =====
# Configuration for ticktack 2.0 documentation

site_name: ticktack
site_description: Differentiable carbon box modelling and Bayesian radiocarbon inference in JAX
repo_url: https://github.com/SharmaLlama/ticktack
repo_name: SharmaLlama/ticktack

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            show_category_heading: false

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Tutorials: tutorials.md
      - "Migrating from v1 to v2": migration.md
  - Physics & Methodology:
      - "Physical & Calendar Conventions": conventions.md
      - "Solvers & Carbon Box Models": solvers_and_cbms.md
      - "Fisher Information & EffectiveCBMs": fisher_and_effective_cbm.md
      - "Gaussian Processes & Information Field Theory": gp_and_ift.md
      - "Bundled Datasets": data.md
  - API Reference:
      - Overview: api/index.md
      - "Carbon Box Models & Presets": api/cbm.md
      - "Production Terms": api/production.md
      - "Solvers & RadiocarbonModel": api/solvers_model.md
      - "Data & Calendar Auditing": api/data.md
      - "Linear Marginalization & POD": api/linear.md
      - "IFT Fields & Kernel Selection": api/fields.md
      - "Likelihood, Fitting, Sampling & Fisher": api/inference.md
      - "Plotting & Legacy Compatibility": api/plotting_legacy.md
