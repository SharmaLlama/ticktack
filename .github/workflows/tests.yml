name: integration

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: test-ticktack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ticktack and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src tests .github/scripts

      - name: Run CI ratchets (complexity & line budget)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF"
            python .github/scripts/check_ratchets.py --base-ref "origin/$BASE_REF"
          else
            python .github/scripts/check_ratchets.py
          fi

      - name: Run pytest with coverage floor
        run: |
          COV_FLOOR=$(python .github/scripts/check_ratchets.py --print-coverage-floor)
          pytest tests/ --cov=ticktack --cov-report=term-missing --cov-fail-under="$COV_FLOOR"

  notebooks:
    name: execute-docs-notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ticktack and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute fast docs example notebooks
        run: python .github/scripts/run_notebooks.py

  trial-merge:
    name: trial-merge-overlapping-prs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ticktack and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Trial-merge overlapping open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "$BASE_REF"
          python .github/scripts/trial_merge.py \
            --repo "${{ github.repository }}" \
            --pr-number "$PR_NUMBER" \
            --base-ref "$BASE_REF"
